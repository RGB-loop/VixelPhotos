appId: com.vixel.app
productName: Vixel
copyright: Copyright 2026 Vixel Team
directories:
  buildResources: resources
  output: release
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!**/*.test.{ts,tsx,js}'
  - '!**/*.spec.{ts,tsx,js}'
  - '!src/*'
  - '!scripts/*'
  - '!docs/**'
  - '!vitest.config.*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.cli.json}'
  - '!{Vixel_PRD.md,Vixel_Tech.md,SKILL.md}'
asar: true
# asarIntegrity: 防止打包后 asar 被替换；Electron 启动时校验摘要
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/onnxruntime-node/**
  - node_modules/sqlite-vec/**
  - node_modules/@node-rs/jieba*/**
# 本地模型作为 extraResources（运行时通过 process.resourcesPath 访问）
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*'

mac:
  icon: build/icon.icns
  category: public.app-category.photography
  # 加固运行时 + 自定义 entitlements；JIT/V8 + .node 加载所需
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # 公证：默认 false（dev / 无证书机器）。CI release 用 CLI override 打开：
  #   electron-builder --mac --c.mac.notarize=true
  # 配合 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 环境变量
  notarize: false
  # 单架构 DMG（按当前 build 机器架构）— CI 上分别跑 arm64/x64
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  writeUpdateInfo: false # MVP 阶段未引入 auto-updater，避免误生成

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: vixel.com
  category: Graphics
